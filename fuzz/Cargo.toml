[package]
name = "runvane-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
runvane = { path = ".." }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "fuzz_priority_parse"
path = "fuzz_targets/fuzz_priority_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_run_filter"
path = "fuzz_targets/fuzz_run_filter.rs"
test = false
doc = false

[[bin]]
name = "fuzz_event_filter"
path = "fuzz_targets/fuzz_event_filter.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cli_spec"
path = "fuzz_targets/fuzz_cli_spec.rs"
test = false
doc = false

[[bin]]
name = "fuzz_tags_json"
path = "fuzz_targets/fuzz_tags_json.rs"
test = false
doc = false
