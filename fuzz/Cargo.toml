[package]
name = "aegisfs-fuzz"
version = "0.1.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
aegisfs = { path = ".." }
libfuzzer-sys = "0.4"

[profile.release]
debug = 1

[[bin]]
name = "chunking"
path = "fuzz_targets/chunking.rs"
test = false
doc = false

[[bin]]
name = "checksum"
path = "fuzz_targets/checksum.rs"
test = false
doc = false

[[bin]]
name = "serialization"
path = "fuzz_targets/serialization.rs"
test = false
doc = false

[[bin]]
name = "dedup"
path = "fuzz_targets/dedup.rs"
test = false
doc = false

[[bin]]
name = "compression"
path = "fuzz_targets/compression.rs"
test = false
doc = false
