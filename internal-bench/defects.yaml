## Status legend

- `draft` — brainstormed, not yet reviewed
- `indep` — survives independence review (distinct root cause)
- `dup` — duplicate of another entry (dropped or merged)
- `injected` — reverted-commit installed on the branch
- `packed` — Phase 11 bundle complete