# Defect catalogue — Runvane benchmark

Tracking manifest for the Phase 10 defect injection exercise. This directory
is deliberately part of the repo (internal tooling for the benchmark pack) but
is excluded from anything handed to a task-solving agent as "the repo": the
`instructions.md`, patches, and tests for any individual task reference only
the golden tag and the single reverted commit.

## Rules

- 30-36 candidates; 25-30 must survive independence review.
- One isolated, cleanly revertible commit per defect, on top of the golden tag.
- Every candidate records: id, subsystem, category, mechanism, detection,
  fix, independence check.
- Categories and detection methods follow the table in `PLAN.md`.

