[package]
name = "runvane"
version = "0.1.0"
edition = "2021"
description = "Runvane — a durable distributed workflow-orchestration platform for internal platform teams."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aegisfs/aegisfs"
homepage = "https://github.com/aegisfs/aegisfs"
readme = "README.md"
keywords = ["workflow", "orchestration", "scheduler", "queue", "automation"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "runvane"
path = "src/lib.rs"

[[bin]]
name = "runvane"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs", "macros", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env", "string"] }
axum = { version = "0.7", features = ["http1", "http2", "json", "tokio", "query", "tracing"] }
tower = { version = "0.5", features = ["util", "timeout", "balance"] }
tower-http = { version = "0.5", features = ["trace", "request-id", "cors"] }
tonic = { version = "0.12", features = ["transport", "gzip", "tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
regex = "1"
tracing-test = "0.2"
futures = "0.3"
async-trait = "0.1"
lru = "0.12"
smallvec = "1"
nonempty = "0.10"
delegate = "0.12"
bitflags = { version = "2", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
zeroize = "1"
url = "2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std", "alloc"] }
test-case = "3"
pretty_assertions = "1"
tokio-test = "0.4"
rand_chacha = "0.3"
serde_json = "1"
futures = "0.3"

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]
loom = ["dep:loom"]

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
# Model-checked concurrency tests, feature-gated; see `queue::loom_model`.
loom = { version = "0.7", optional = true }

# The `fuzz/` crate is intentionally NOT a workspace member: cargo-fuzz needs
# its own package/profiles and its targets must not be built by ordinary
# `cargo build`/`cargo test` runs. Operate on it with `cd fuzz && cargo fuzz ...`.
[workspace]
members = ["."]
resolver = "2"

[profile.release]
lto = false
codegen-units = 16
opt-level = 3

[profile.bench]
debug = true